<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Your Password</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Arial, sans-serif;
    }
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 450px;
      width: 100%;
    }
    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 24px;
    }
    p {
      color: #666;
      margin-bottom: 25px;
      font-size: 14px;
      line-height: 1.5;
    }
    label {
      display: block;
      color: #333;
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 14px;
    }
    input[type="password"] {
      width: 100%;
      padding: 14px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 16px;
      margin-bottom: 20px;
      transition: border-color 0.3s;
    }
    input[type="password"]:focus {
      outline: none;
      border-color: #667eea;
    }
    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .success {
      background: #d4edda;
      color: #155724;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }
    .error {
      background: #f8d7da;
      color: #721c24;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="success" id="successMsg">
      ✅ Your password has been reset successfully! Check your email for confirmation.
    </div>
    <div class="error" id="errorMsg">
      ❌ Something went wrong. Please try again or request a new reset link.
    </div>

    <div id="formSection">
      <h1>Reset Your Password</h1>
      <p>Enter your new password below. Make sure it's at least 8 characters long.</p>

      <form id="resetForm">
        <input type="hidden" id="token" name="token">

        <label for="newPassword">New Password</label>
        <input type="password" id="newPassword" name="new_password" placeholder="Enter new password" required minlength="8">

        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" placeholder="Confirm new password" required minlength="8">

        <button type="submit" id="submitBtn">Reset Password</button>
      </form>
    </div>
  </div>

  <script>
    // 1. Get token from URL
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    const email = urlParams.get('email');

    // 2. If no token, show error
    if (!token) {
      document.getElementById('formSection').classList.add('hidden');
      document.getElementById('errorMsg').style.display = 'block';
      document.getElementById('errorMsg').textContent = '❌ Invalid reset link. Please request a new one.';
    } else {
      document.getElementById('token').value = token;
    }

    // 3. Handle form submission
    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const password = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const submitBtn = document.getElementById('submitBtn');

      // Check passwords match
      if (password !== confirmPassword) {
        document.getElementById('errorMsg').style.display = 'block';
        document.getElementById('errorMsg').textContent = '❌ Passwords do not match!';
        return;
      }

      // Disable button
      submitBtn.disabled = true;
      submitBtn.textContent = 'Resetting...';

      try {
        // 4. POST to Make webhook
        const response = await fetch('https://hook.us2.make.com/1fyaemj5w4k2uc5o95amltv6is145z4m', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            token: token,
            email: email,
            new_password: password
          })
        });

        // 5. Show success
        document.getElementById('formSection').classList.add('hidden');
        document.getElementById('successMsg').style.display = 'block';

      } catch (error) {
        document.getElementById('errorMsg').style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Reset Password';
      }
    });
  </script>
</body>
</html>
